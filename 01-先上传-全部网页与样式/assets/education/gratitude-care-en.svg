<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc"><title id="title">A gesture of thanks. A bond of trust.</title><desc id="desc">A symbolic pennant expressing thanks for care; this is not a photograph of a patient gift.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fcf8f3"/><stop offset="1" stop-color="#eddfd3"/></linearGradient><linearGradient id="flag" x2="1" y2="1"><stop stop-color="#94564b"/><stop offset="1" stop-color="#74463e"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#684637" flood-opacity=".10"/></filter></defs><rect width="1280" height="740" fill="url(#bg)"/><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><circle cx="1030" cy="390" r="245" fill="#e2cdb9" opacity=".45"/><circle cx="125" cy="30" r="210" fill="#fffdf8" opacity=".8"/><text x="74" y="125" fill="#875148" font-size="22" letter-spacing="3">PATIENT GRATITUDE</text><text x="74" y="194" fill="#493b38" font-size="35" font-weight="700">A gesture of thanks. A bond of trust.</text><g filter="url(#shadow)"><path d="M730 260H1094V535L912 626L730 535Z" fill="url(#flag)"/><path d="M750 282H1074V523L912 604L750 523Z" fill="none" stroke="#d9b770" stroke-width="4"/><path d="M710 253H1112" stroke="#a77b55" stroke-width="13" stroke-linecap="round"/><path d="M805 251L910 200L1018 251" fill="none" stroke="#b18a5f" stroke-width="4"/><path d="M885 321C864 290 820 310 829 341C835 365 864 381 885 394C908 380 936 359 940 337C945 305 903 291 885 321Z" transform="translate(28 20)" fill="#f0d49c"/><text x="912" y="465" text-anchor="middle" fill="#f7e5bf" font-size="30" font-weight="700">THANK YOU</text><text x="912" y="513" text-anchor="middle" fill="#f0d49c" font-size="23">FOR YOUR CARE</text></g><circle cx="90" cy="318" r="6" fill="#b38a68"/><text x="116" y="326" fill="#745b50" font-size="27">Listening with care</text><circle cx="90" cy="396" r="6" fill="#b38a68"/><text x="116" y="404" fill="#745b50" font-size="27">Explaining with patience</text><circle cx="90" cy="474" r="6" fill="#b38a68"/><text x="116" y="482" fill="#745b50" font-size="27">Supporting every follow-up</text><text x="74" y="685" fill="#947c6c" font-size="20">Thematic illustration · Not a photograph of a patient gift</text></g></svg>